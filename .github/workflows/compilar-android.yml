name: Compilar Mophie TV Android - APK sem assinatura

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar JavaScript
        run: |
          for f in app/js/*.js; do node --check "$f"; done

      - name: Configurar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android_native
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp android_native/app/build/outputs/apk/release/app-release-unsigned.apk dist/MophieTV_v1.6.3_UNSIGNED.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MophieTV_v1.6.3_APK
          path: dist/MophieTV_v1.6.3_UNSIGNED.apk
          if-no-files-found: error
