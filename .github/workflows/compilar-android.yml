name: Compilar Mophie TV Android — APK sem assinatura
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar sintaxe JavaScript
        run: |
          for f in app/js/*.js; do node --check "$f"; done
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK Android nativo
        working-directory: android_native
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Conferir versão e pacote
        run: |
          set -euo pipefail
          APK=android_native/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.mophie.tv' versionCode='32' versionName='1.6.3'"
          mkdir -p dist
          cp "$APK" dist/MophieTV_TCL_v1.6.3_NATIVE_UNSIGNED.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MophieTV_v1.6.3_APK_NATIVO_SEM_ASSINATURA
          path: dist/MophieTV_TCL_v1.6.3_NATIVE_UNSIGNED.apk
          if-no-files-found: error
