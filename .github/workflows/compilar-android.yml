name: Compilar Mophie TV Android - APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android_native/**'
      - '.github/workflows/compilar-android.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar sintaxe JavaScript
        run: |
          set -e
          for f in app/js/*.js; do node --check "$f"; done

      - name: Configurar Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        working-directory: android_native
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Conferir pacote e versão
        run: |
          set -euo pipefail
          APK="android_native/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.mophie.tv' versionCode='33' versionName='1.6.4'"

      - name: Assinar APK quando a chave estiver configurada
        env:
          KEYSTORE_B64: ${{ secrets.MOPHIE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOPHIE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="android_native/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/mophie-release.jks"
            export MOPHIE_SIGN_PASS="$KEYSTORE_PASSWORD"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/mophie-release.jks" --ks-key-alias mophietv \
              --ks-pass env:MOPHIE_SIGN_PASS --key-pass env:MOPHIE_SIGN_PASS \
              --out dist/MophieTV_v1.6.4_ASSINADO.apk "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/MophieTV_v1.6.4_ASSINADO.apk
            rm -f "$RUNNER_TEMP/mophie-release.jks"
          else
            keytool -genkeypair -noprompt -alias mophietv-teste \
              -keystore "$RUNNER_TEMP/mophie-teste.jks" -storepass android -keypass android \
              -dname "CN=Mophie TV Teste,OU=Build,O=Mophie,C=BR" -keyalg RSA -keysize 2048 -validity 3650
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$RUNNER_TEMP/mophie-teste.jks" --ks-key-alias mophietv-teste \
              --ks-pass pass:android --key-pass pass:android \
              --out dist/MophieTV_v1.6.4_TESTE_INSTALACAO_LIMPA.apk "$APK"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/MophieTV_v1.6.4_TESTE_INSTALACAO_LIMPA.apk
            rm -f "$RUNNER_TEMP/mophie-teste.jks"
            echo "::warning::APK de teste assinado com chave temporária. Requer instalação limpa. Para atualizar sem remover app anterior, configure a assinatura definitiva nos Secrets."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: MophieTV_v1.6.4_APK
          path: dist/*.apk
          if-no-files-found: error
